<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Profilo</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Ubuntu', sans-serif;
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #0f2027, #203a43);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        @keyframes gradient {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        .form-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        input {
            background-color: #fff;
            color: #1e3c72;
        }
        button {
            background-color: #ffffff;
            color: #1e3c72;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #cce1ff;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Profilo - {{ utente.ruolo|title }}</h2>
    <form method="post">
        {% csrf_token %}

        {% if utente.ruolo == 'privato' %}
            <input type="date" name="data_nascita" value="{{ utente.data_nascita|date:'Y-m-d' }}">
            <input type="text" name="telefono" placeholder="Telefono" value="{{ utente.telefono|default:'' }}">
        {% elif utente.ruolo == 'azienda' %}
            <input type="text" name="partita_iva" placeholder="Partita IVA" value="{{ utente.partita_iva|default:'' }}">
            <input type="text" name="telefono_aziendale" placeholder="Telefono Aziendale" value="{{ utente.telefono_aziendale|default:'' }}">
        {% endif %}

        <input type="text" name="nazionalita" placeholder="Nazionalità" value="{{ utente.nazionalita|default:'' }}">
        <button type="submit">Salva</button>
    </form>
</div>

</body>
</html>
